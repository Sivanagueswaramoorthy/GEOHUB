name: geohub
description: "GeoHub - Club Management, Event Orchestration, Smart QR Attendance & Analytics Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  cloud_functions: ^5.0.1

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Charts & Visualizations
  fl_chart: ^0.68.0

  # Utilities & Media
  intl: ^0.19.0
  uuid: ^4.4.0
  file_picker: ^8.0.5
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
