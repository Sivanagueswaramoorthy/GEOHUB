services:
  - type: web
    name: geohub-backend
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: TIDB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USERNAME
        value: 2oGb7FpyxpLhZWE.root
      - key: TIDB_PASSWORD
        value: pEVtiQBWbs9PAGBB
      - key: TIDB_DATABASE
        value: geohub
      - key: DATABASE_URL
        value: mysql+pymysql://2oGb7FpyxpLhZWE.root:pEVtiQBWbs9PAGBB@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/geohub
      - key: SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

