<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 4 Sharp White Corner Brackets forming Centered Square Scan Frame -->
  <!-- Top-Left -->
  <path d="M 220 584 L 220 520 L 284 520" 
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" />
  
  <!-- Top-Right -->
  <path d="M 796 520 L 860 520 L 860 584" 
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" />

  <!-- Bottom-Left -->
  <path d="M 220 1096 L 220 1160 L 284 1160" 
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" />

  <!-- Bottom-Right -->
  <path d="M 796 1160 L 860 1160 L 860 1096" 
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" />

  <!-- Horizontal Bright Green Scan Line (#22C55E) -->
  <line x1="220" y1="840" x2="860" y2="840" 
        stroke="#22C55E" stroke-width="4" filter="url(#laserGlow)" />

  <!-- Helper Text -->
  <text x="50%" y="1242" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" 
        font-size="32" 
        font-weight="400" 
        letter-spacing="0.3">Position QR code within the frame to scan</text>

  <!-- Outlined Pill Button with White 3px Border and White Text "Use OTP" -->
  <rect x="370" y="1356" width="340" height="88" rx="44" 
        fill="none" stroke="#FFFFFF" stroke-width="3" />
  <text x="50%" y="1410" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" 
        font-size="30" 
        font-weight="700" 
        letter-spacing="0.5">Use OTP</text>
</svg>