services:
  - type: web
    name: geohub
    env: python
    plan: free
    region: singapore # or oregon, frankfurt, ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
